<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetup</title>
<style>
:root{--bg:#161d27;--tile:#222d3b;--line:#33415a;--text:#e8edf4;--muted:#93a1b5;--accent:#3fb6a8;--danger:#e5574f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* Lobby */
#lobby{min-height:100%;display:grid;place-items:center;padding:24px}
.lobby-box{width:min(420px,100%)}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.lobby-box p{color:var(--muted);margin:0 0 24px}
label{display:block;font-size:.9rem;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:12px 14px;background:var(--tile);border:1px solid var(--line);border-radius:8px}
.primary{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#06211e;font-weight:600;cursor:pointer}
#err{color:var(--danger);min-height:1.5em;margin-top:12px}

/* Meeting */
#meeting{height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);gap:12px}
.top span{color:var(--muted);font-size:.9rem}
.link-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.main{flex:1;display:flex;min-height:0}
#grid{flex:1;display:grid;gap:10px;padding:10px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));grid-auto-rows:minmax(180px,1fr);min-height:0;overflow:auto}
.tile{position:relative;background:var(--tile);border-radius:10px;overflow:hidden;min-height:180px}
.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.tile.local video{transform:scaleX(-1)}
.tile.local.sharing video{transform:none;object-fit:contain}
.tile .nm{position:absolute;left:8px;bottom:8px;background:rgba(10,15,22,.7);padding:2px 10px;border-radius:6px;font-size:.85rem}
#chat{width:300px;border-left:1px solid var(--line);display:flex;flex-direction:column}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg b{display:block;font-size:.8rem;color:var(--muted);font-weight:500}
.msg p{margin:0;word-break:break-word}
#chatform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#chatform button{background:var(--accent);color:#06211e;border:0;border-radius:8px;padding:0 14px;font-weight:600;cursor:pointer}
.bar{display:flex;justify-content:center;gap:10px;padding:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.bar button{padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--tile);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--accent);color:#06211e;border-color:var(--accent)}
.bar button.off{background:var(--danger);border-color:var(--danger);color:#fff}
.bar .leave{background:var(--danger);border-color:var(--danger);color:#fff}
@media(max-width:700px){#chat{position:fixed;inset:0 0 64px 0;width:auto;background:var(--bg);z-index:5}}
</style>
</head>
<body>

<section id="lobby">
  <form class="lobby-box" id="joinForm">
    <h1>Meetup</h1>
    <p>Video meetings in your browser. Share the link and others can join.</p>
    <label for="name">Your name</label>
    <input id="name" required maxlength="30" autocomplete="name">
    <label for="room">Meeting code</label>
    <input id="room" required maxlength="40" pattern="[A-Za-z0-9\-]+">
    <button class="primary" type="submit">Join meeting</button>
    <div id="err" role="alert"></div>
  </form>
</section>

<section id="meeting" class="hidden">
  <div class="top">
    <span id="roomLabel"></span>
    <button class="link-btn" id="copy">Copy invite link</button>
  </div>
  <div class="main">
    <div id="grid"></div>
    <aside id="chat" class="hidden" aria-label="Chat">
      <div id="msgs"></div>
      <form id="chatform"><input id="chatInput" placeholder="Message everyone" maxlength="1000" autocomplete="off"><button>Send</button></form>
    </aside>
  </div>
  <div class="bar">
    <button id="micBtn">Mute</button>
    <button id="camBtn">Stop video</button>
    <button id="shareBtn" aria-pressed="false">Share screen</button>
    <button id="chatBtn" aria-pressed="false">Chat</button>
    <button id="leaveBtn" class="leave">Leave</button>
  </div>
</section>

<script>
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const $ = (id) => document.getElementById(id);

let ws, myId, myName, roomName, localStream, camTrack, screenStream;
const peers = {}; // id -> { pc, name }

// ---------- Lobby ----------
const params = new URLSearchParams(location.search);
$('room').value = params.get('room') || Math.random().toString(36).slice(2, 8);
$('name').value = localStorage.getItem('meetup-name') || '';

$('joinForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  myName = $('name').value.trim();
  roomName = $('room').value.trim();
  try { localStorage.setItem('meetup-name', myName); } catch {}
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch {
    try { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { $('err').textContent = 'Camera and microphone are blocked. Allow access in your browser, then try again.'; return; }
  }
  camTrack = localStream.getVideoTracks()[0] || null;
  $('lobby').classList.add('hidden');
  $('meeting').classList.remove('hidden');
  $('roomLabel').textContent = 'Meeting: ' + roomName;
  addTile('me', myName + ' (you)', localStream, true);
  connect();
});

// ---------- Signaling ----------
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', room: roomName, name: myName }));
  ws.onmessage = async ({ data }) => {
    const m = JSON.parse(data);
    if (m.type === 'welcome') {
      myId = m.id;
      m.peers.forEach((p) => createPeer(p.id, p.name, true));
    } else if (m.type === 'peer-joined') {
      createPeer(m.id, m.name, false);
    } else if (m.type === 'signal') {
      handleSignal(m.from, m.data);
    } else if (m.type === 'peer-left') {
      removePeer(m.id);
    } else if (m.type === 'chat') {
      addMsg(m.from === myId ? 'You' : m.name, m.text);
    } else if (m.type === 'full') {
      alert('This meeting is full (6 people max).');
      location.reload();
    }
  };
  ws.onclose = () => { if (myId) addMsg('System', 'Connection to the server was lost. Reload to rejoin.'); };
}
const signal = (to, data) => ws.send(JSON.stringify({ type: 'signal', to, data }));

// ---------- Peer connections ----------
async function createPeer(id, name, initiator) {
  const pc = new RTCPeerConnection(ICE);
  peers[id] = { pc, name };
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  if (!localStream.getVideoTracks().length) pc.addTransceiver('video', { direction: 'recvonly' });

  pc.onicecandidate = (e) => e.candidate && signal(id, { candidate: e.candidate });
  pc.ontrack = (e) => addTile(id, name, e.streams[0], false);
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') pc.restartIce();
  };

  if (initiator) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    signal(id, { description: pc.localDescription });
  }
}

async function handleSignal(from, data) {
  const p = peers[from];
  if (!p) return;
  const pc = p.pc;
  try {
    if (data.description) {
      await pc.setRemoteDescription(data.description);
      if (data.description.type === 'offer') {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        signal(from, { description: pc.localDescription });
      }
    } else if (data.candidate) {
      await pc.addIceCandidate(data.candidate);
    }
  } catch (err) { console.error('signal error', err); }
}

function removePeer(id) {
  peers[id]?.pc.close();
  delete peers[id];
  $('tile-' + id)?.remove();
}

// ---------- UI ----------
function addTile(id, label, stream, local) {
  let tile = $('tile-' + id);
  if (!tile) {
    tile = document.createElement('div');
    tile.id = 'tile-' + id;
    tile.className = 'tile' + (local ? ' local' : '');
    tile.innerHTML = '<video autoplay playsinline></video><span class="nm"></span>';
    tile.querySelector('.nm').textContent = label;
    $('grid').appendChild(tile);
  }
  const v = tile.querySelector('video');
  v.muted = local; // never play your own audio back
  if (v.srcObject !== stream) v.srcObject = stream;
}

function addMsg(who, text) {
  const d = document.createElement('div');
  d.className = 'msg';
  const b = document.createElement('b'); b.textContent = who;
  const p = document.createElement('p'); p.textContent = text;
  d.append(b, p);
  $('msgs').appendChild(d);
  $('msgs').scrollTop = 1e9;
}

$('micBtn').onclick = (e) => {
  const t = localStream.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled;
  e.target.textContent = t.enabled ? 'Mute' : 'Unmute';
  e.target.classList.toggle('off', !t.enabled);
};
$('camBtn').onclick = (e) => {
  if (!camTrack) return;
  camTrack.enabled = !camTrack.enabled;
  e.target.textContent = camTrack.enabled ? 'Stop video' : 'Start video';
  e.target.classList.toggle('off', !camTrack.enabled);
};

function swapVideo(track) {
  Object.values(peers).forEach(({ pc }) => {
    const s = pc.getSenders().find((x) => x.track && x.track.kind === 'video');
    if (s) s.replaceTrack(track);
  });
}
$('shareBtn').onclick = async (e) => {
  const tile = $('tile-me');
  if (screenStream) return stopShare();
  try { screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true }); }
  catch { return; }
  const track = screenStream.getVideoTracks()[0];
  swapVideo(track);
  tile.querySelector('video').srcObject = screenStream;
  tile.classList.add('sharing');
  e.target.setAttribute('aria-pressed', 'true');
  e.target.textContent = 'Stop sharing';
  track.onended = stopShare;
};
function stopShare() {
  if (!screenStream) return;
  screenStream.getTracks().forEach((t) => t.stop());
  screenStream = null;
  if (camTrack) swapVideo(camTrack);
  const tile = $('tile-me');
  tile.querySelector('video').srcObject = localStream;
  tile.classList.remove('sharing');
  $('shareBtn').setAttribute('aria-pressed', 'false');
  $('shareBtn').textContent = 'Share screen';
}

$('chatBtn').onclick = (e) => {
  const open = $('chat').classList.toggle('hidden') === false;
  e.target.setAttribute('aria-pressed', String(open));
};
$('chatform').onsubmit = (e) => {
  e.preventDefault();
  const text = $('chatInput').value.trim();
  if (text) ws.send(JSON.stringify({ type: 'chat', text }));
  $('chatInput').value = '';
};
$('copy').onclick = async (e) => {
  const url = location.origin + location.pathname + '?room=' + encodeURIComponent(roomName);
  try { await navigator.clipboard.writeText(url); e.target.textContent = 'Link copied'; }
  catch { prompt('Copy this link:', url); }
  setTimeout(() => (e.target.textContent = 'Copy invite link'), 2000);
};
$('leaveBtn').onclick = () => {
  Object.keys(peers).forEach(removePeer);
  localStream.getTracks().forEach((t) => t.stop());
  ws.close();
  location.href = location.pathname;
};
</script>
</body>
</html>
